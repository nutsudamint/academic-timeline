<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ขั้นตอนการยื่นขอกำหนดตำแหน่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f8f9fc;
    --ink:#1b2333; --ink-2:#4a556b; --ink-3:#7c869a;
    --line:#e3e7ef; --line-2:#cfd6e3;
    --primary:#22407a; --primary-2:#2f5aa8; --primary-soft:#e8eef9;
    --accent:#c8962e; --accent-soft:#fbf3e2;
    --danger:#c0392b; --danger-soft:#fdecea;
    --ok:#2e7d5b;
    --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06);
    --shadow-hover:0 2px 4px rgba(20,30,60,.08),0 10px 28px rgba(20,30,60,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  body.editing{padding-bottom:90px}
  button,input,textarea,select{font:inherit;color:inherit}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px}
  svg.i{width:1em;height:1em;flex:none;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(135deg,var(--primary) 0%,#1a3263 100%);color:#fff;padding:40px 0 64px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.05)}
  .hero-kicker{font-size:14px;letter-spacing:.02em;color:#f1d79c;font-weight:600}
  .hero h1{margin:6px 0 8px;font-size:clamp(24px,4vw,34px);line-height:1.3;font-weight:700}
  .hero p{margin:0;max-width:640px;color:rgba(255,255,255,.82)}
  .hero .btn{margin-top:18px}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;white-space:nowrap}
  .btn.sm{padding:6px 12px;font-size:14px}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-2)}
  .btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.ghost-light{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
  .btn.ghost-light:hover{background:rgba(255,255,255,.2)}
  .btn.link{background:none;border:none;padding:6px 0;color:var(--primary)}
  .btn.link:hover{text-decoration:underline}
  .btn.dashed{width:100%;justify-content:center;background:transparent;border:2px dashed var(--line-2);color:var(--ink-2);padding:14px}
  .btn.dashed:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
  .icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary)}
  .icon-btn.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
  .icon-btn:disabled{opacity:.35;cursor:default}

  /* ---------- Timeline ---------- */
  .content{margin-top:-36px;position:relative;z-index:1}
  .tl-intro{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;color:var(--ink-2);font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
  .tl-intro b{color:var(--ink)}
  .timeline{list-style:none;margin:0;padding:0;position:relative}
  .timeline::before{content:"";position:absolute;left:23px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--primary),var(--accent));border-radius:3px;opacity:.35}
  .tl-item{position:relative;padding-left:68px;margin-bottom:20px}
  .tl-node{position:absolute;left:0;top:14px;width:48px;height:48px;border-radius:50%;background:var(--surface);border:3px solid var(--primary);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 0 0 5px var(--bg);transition:background .2s,color .2s}
  .tl-item:hover .tl-node{background:var(--primary);color:#fff}
  .tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;position:relative;outline:none}
  .tl-card:hover,.tl-card:focus-visible{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--primary-soft)}
  .tl-card:focus-visible{border-color:var(--primary)}
  .tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tl-step{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.03em}
  .tl-card h3{margin:4px 0 2px;font-size:18px;line-height:1.45;font-weight:700}
  .tl-sub{margin:4px 0 0;color:var(--ink-2);font-size:15px}
  .tl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .tl-go{color:var(--primary);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
  .tl-card:hover .tl-go svg{transform:translateX(3px)}
  .tl-go svg{transition:transform .2s}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:500}
  .chip.time{background:var(--accent-soft);color:#8a6418}
  .chip.zero{background:var(--surface-2);color:var(--ink-3)}
  .tools{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .tools .sp{flex:1}
  .add-step{padding-left:68px;margin-top:4px}

  /* ---------- Detail ---------- */
  .detail{padding-top:8px}
  .detail .content-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .mini-steps{display:flex;gap:6px;flex-wrap:wrap}
  .mini-steps button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-weight:700;cursor:pointer;font-size:14px}
  .mini-steps button:hover{border-color:var(--primary);color:var(--primary)}
  .mini-steps button.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .mini-steps button.done{border-color:var(--primary);color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px}
  .detail-head h2{margin:4px 0 6px;font-size:clamp(20px,3vw,26px);line-height:1.4}
  .detail-head .tl-sub{font-size:16px}
  .note{margin-top:14px;background:var(--surface-2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;white-space:pre-wrap;color:var(--ink-2);font-size:15px}
  .head-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .docs{margin-top:24px}
  .docs-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .docs-head h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
  .count{background:var(--primary);color:#fff;border-radius:999px;font-size:13px;padding:1px 9px}
  .doc-grid{display:grid;gap:12px}
  .doc{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .doc-ic{width:48px;height:56px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;background:#7c869a;letter-spacing:.02em}
  .doc-ic.pdf{background:#d0473a}.doc-ic.word{background:#2b5fb4}.doc-ic.excel{background:#22814f}.doc-ic.ppt{background:#d0692b}.doc-ic.img{background:#7a4fb5}.doc-ic.link{background:var(--accent);font-size:20px}
  .doc-body{flex:1;min-width:0}
  .doc-body h4{margin:0;font-size:16px;line-height:1.4;word-break:break-word}
  .doc-body p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
  .doc-meta{font-size:13px;color:var(--ink-3);margin-top:2px}
  .doc-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .empty{text-align:center;padding:36px 20px;border:2px dashed var(--line-2);border-radius:var(--radius);color:var(--ink-3);background:var(--surface)}
  .empty svg{width:36px;height:36px;margin-bottom:6px;opacity:.6}
  .pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0 40px}
  .pager button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:var(--shadow)}
  .pager button:hover{border-color:var(--primary)}
  .pager button.next{text-align:right;grid-column:2}
  .pager small{display:block;color:var(--ink-3);font-size:13px}
  .pager span{font-weight:600;color:var(--primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  footer.foot{text-align:center;color:var(--ink-3);font-size:13px;padding:24px 0 36px}

  /* ---------- Edit bar ---------- */
  .editbar{position:fixed;left:0;right:0;bottom:0;background:#1b2333;color:#fff;z-index:20;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
  .editbar-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;flex-wrap:wrap}
  .eb-label{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .eb-label em{font-style:normal;font-weight:400;color:#f1d79c;font-size:14px}
  .eb-actions{display:flex;gap:8px;flex-wrap:wrap}
  .editbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
  .editbar .btn.ghost:hover{border-color:#fff;color:#fff}
  .editbar .btn.primary{background:var(--accent);color:#1b2333}
  .editbar .btn.primary:hover{background:#dcaa45}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,22,38,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;animation:fade .15s}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
  .modal.wide{max-width:960px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-head h3{margin:0;font-size:18px;word-break:break-word}
  .modal-body{padding:18px 20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
  .field{display:block;margin-bottom:14px}
  .field>span{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;background:var(--surface);resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .hint{font-size:13px;color:var(--ink-3);margin-top:4px}
  .seg{display:flex;gap:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .seg label{flex:1;text-align:center;padding:9px 8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
  .seg input{display:none}
  .seg label:has(input:checked){background:var(--primary);color:#fff}
  .drop{position:relative;display:block;border:2px dashed var(--line-2);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-2);margin-bottom:10px;transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
  .drop b{display:block;color:var(--primary)}
  .drop small{color:var(--ink-3)}
  .file-list{font-size:14px;color:var(--ink-2);margin:-4px 0 12px;padding-left:18px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin-bottom:14px;cursor:pointer}
  .check input{margin-top:5px}
  .sect{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
  .sect h4{margin:0 0 8px;font-size:15px}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap}
  .preview{background:#525659;border-radius:10px;overflow:hidden;height:70vh;display:grid;place-items:center}
  .preview iframe{width:100%;height:100%;border:0;background:#fff}
  .preview img{max-width:100%;max-height:100%;object-fit:contain}

  /* ---------- Toast ---------- */
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1b2333;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.warn{background:#8a3b12}

  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}

  @media (max-width:640px){
    .wrap{padding:0 16px}
    .hero{padding:28px 0 56px}
    .timeline::before{left:17px}
    .tl-item,.add-step{padding-left:50px}
    .tl-node{width:36px;height:36px;font-size:15px;top:16px}
    .tl-card{padding:14px 16px}
    .card{padding:18px}
    .doc{flex-wrap:wrap}
    .doc-actions{width:100%;justify-content:flex-start;padding-left:62px}
    .pager{grid-template-columns:1fr}
    .pager button.next{grid-column:1}
  }
  @media print{
    .editbar,.tools,.add-step,.hero .btn,.doc-actions,.pager{display:none!important}
    body{background:#fff}
  }
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

     ระบบจะดาวน์โหลดไฟล์ใหม่ที่มีข้อมูลและเอกสารฝังอยู่ในตัว ให้ใช้ไฟล์ใหม่นั้นแทนไฟล์เดิม

    const bin = atob(body); const arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type: mime });
  }
  function saveBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function downloadName(d) { const e = extOf({ name: d.fileName }); return /\.[a-z0-9]{1,5}$/i.test(d.name) || !e ? d.name : d.name + '.' + e; }
  function readFile(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  }

  function openModal(opt) {
    modalRoot.innerHTML = '<div class="overlay"><div class="modal' + (opt.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + esc(opt.title) + '</h3><button type="button" class="icon-btn" data-close aria-label="ปิด">' + icon('x') + '</button></div>' +
      '<form class="modal-body" novalidate>' + opt.body +
        (opt.onSubmit ? '<div class="modal-foot"><button type="button" class="btn ghost" data-close>ยกเลิก</button><button type="submit" class="btn primary">' + esc(opt.submitText || 'บันทึก') + '</button></div>' : '') +
      '</form></div></div>';
    const form = modalRoot.querySelector('form');
    modalRoot.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    modalRoot.querySelector('.overlay').addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) closeModal(); });
    form.onsubmit = async e => {
      e.preventDefault();
      if (!opt.onSubmit) return;
      const btn = form.querySelector('[type=submit]'); btn.disabled = true;
      try { const r = await opt.onSubmit(form); if (r !== false) closeModal(); }
      finally { btn.disabled = false; }

    const first = form.querySelector('input:not([type=radio]):not([type=file]),textarea,select');
    if (first) first.focus();

  /* ---------------- doc forms ---------------- */
  function docAddForm(step) {
    const form = openModal({
      title: 'เพิ่มเอกสารตัวอย่าง',
      submitText: 'เพิ่มเอกสาร',
      body:
        '<div class="seg"><label><input type="radio" name="kind" value="file" checked>อัปโหลดไฟล์</label><label><input type="radio" name="kind" value="link">ใส่ลิงก์ (เช่น Google Drive)</label></div>' +
        '<div data-kind="file"><label class="drop"><input type="file" name="files" multiple>' +
          '<b>' + icon('download') + ' คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวาง</b><small>PDF, Word, Excel, รูปภาพ · เลือกได้หลายไฟล์ · แนะนำไม่เกิน 10 MB ต่อไฟล์</small></label>' +
          '<ul class="file-list"></ul></div>' +
        '<div data-kind="link" hidden><label class="field"><span>URL *</span><input name="url" type="url" placeholder="https://drive.google.com/..."></label></div>' +
        '<label class="field"><span>ชื่อเอกสารที่แสดง</span><input name="name" placeholder="ถ้าเว้นว่าง จะใช้ชื่อไฟล์"></label>' +
        '<label class="field"><span>หมายเหตุ</span><input name="note" placeholder="เช่น ตัวอย่างการกรอกที่ถูกต้อง"></label>',
      onSubmit: async f => {
        const kind = f.elements.kind.value;
        const name = f.elements.name.value.trim(), note = f.elements.note.value.trim();
        step.docs = step.docs || [];
        if (kind === 'link') {
          const url = f.elements.url.value.trim();
          if (!/^https?:\/\//i.test(url)) { toast('กรุณาใส่ URL ที่ขึ้นต้นด้วย http:// หรือ https://', true); return false; }
          let host = url; try { host = new URL(url).hostname; } catch (e) {}
          step.docs.push({ id: uid(), kind: 'link', name: name || host, url: url, note: note });
          save('เพิ่มลิงก์แล้ว');
          return;
        }
        const files = Array.from(f.elements.files.files);
        if (!files.length) { toast('กรุณาเลือกไฟล์อย่างน้อย 1 ไฟล์', true); return false; }
        const big = files.filter(x => x.size > 10 * 1048576);
        if (big.length && !confirm('มีไฟล์ขนาดเกิน 10 MB (' + big.map(x => x.name).join(', ') + ')\nไฟล์ HTML ที่ส่งออกจะมีขนาดใหญ่ตาม — แนะนำให้ใช้ลิงก์ Google Drive แทน\n\nต้องการเพิ่มต่อหรือไม่?')) return false;
        for (const file of files) {
          const du = await readFile(file);
          step.docs.push({
            id: uid(), kind: 'file',
            name: files.length === 1 && name ? name : file.name,
            fileName: file.name, mime: file.type || 'application/octet-stream',
            size: file.size, data: du, note: note
          });
        }
        save('เพิ่มเอกสาร ' + files.length + ' ไฟล์แล้ว');
      }
    });
    const showKind = () => {
      const k = form.elements.kind.value;
      form.querySelectorAll('[data-kind]').forEach(el => el.hidden = el.dataset.kind !== k);
    };
    form.querySelectorAll('input[name=kind]').forEach(r => r.addEventListener('change', showKind));
    const input = form.elements.files, list = form.querySelector('.file-list'), drop = form.querySelector('.drop');
    input.addEventListener('change', () => {
      list.innerHTML = Array.from(input.files).map(x => '<li>' + esc(x.name) + ' <span style="color:var(--ink-3)">(' + fmtSize(x.size) + ')</span></li>').join('');
    });
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, () => drop.classList.add('over')));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
  }

        const t = f.elements.title.value.trim();
        if (!t) { toast('กรุณากรอกหัวเรื่อง', true); return false; }
        data.title = t; data.kicker = f.elements.kicker.value.trim(); data.subtitle = f.elements.subtitle.value.trim();
        data.showEditButton = !f.elements.hideEdit.checked;
        save('บันทึกการตั้งค่าแล้ว');
      }
    });
    form.querySelector('[data-x=json-out]').onclick = () =>
      saveBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'timeline-backup.json');
    form.querySelector('[data-x=json-in]').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const obj = JSON.parse(await file.text());
        if (!Array.isArray(obj.steps)) throw new Error('bad');
        if (!confirm('นำเข้าข้อมูลนี้แทนข้อมูลปัจจุบันทั้งหมด?')) return;
        data = obj; closeModal(); save('นำเข้าข้อมูลแล้ว');
      } catch (err) { toast('ไฟล์ JSON ไม่ถูกต้อง', true); }
    };
    form.querySelector('[data-x=reset]').onclick = () => {
      if (!confirm('ล้างการแก้ไขที่ยังไม่ได้บันทึกเป็นไฟล์ แล้วกลับไปใช้ข้อมูลในไฟล์ HTML นี้?')) return;
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      data = JSON.parse(JSON.stringify(embedded));
      closeModal(); render(); toast('กลับไปใช้ข้อมูลในไฟล์แล้ว');
    };
  }

  function exportHtml() {
    const doc = new DOMParser().parseFromString(PRISTINE, 'text/html');
    if (!data.updatedAt) data.updatedAt = Date.now();
    doc.getElementById('initial-data').textContent = '\n' + JSON.stringify(data, null, 2).replace(/</g, '\\u003c') + '\n';
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    saveBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), 'timeline-ตำแหน่งวิชาการ.html');
    try { localStorage.setItem(LS_EXPORT, String(data.updatedAt)); } catch (e) {}
    render();
    toast('ดาวน์โหลดไฟล์ใหม่แล้ว — ใช้ไฟล์นี้แทนไฟล์เดิม');
  }

  /* ---------------- events ---------------- */
  function moveStep(id, dir) {
    const i = data.steps.findIndex(s => s.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= data.steps.length) return;
    [data.steps[i], data.steps[j]] = [data.steps[j], data.steps[i]];
    save();
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const a = el.dataset.action, id = el.dataset.id;
    const step = currentStep();
    const findStep = () => data.steps.find(s => s.id === id);
    const findDoc = () => step && (step.docs || []).find(d => d.id === id);

    switch (a) {
      case 'open': go(id); break;
      case 'back': go(null); break;
      case 'enter-edit': editMode = true; render(); toast('เข้าสู่โหมดแก้ไข'); break;
      case 'exit-edit':
        editMode = false; render();
        if (isDirty()) toast('อย่าลืมกด “บันทึกเป็นไฟล์ HTML” เพื่อเก็บการแก้ไขลงไฟล์', true);
        break;
      case 'settings': settingsForm(); break;
      case 'export-html': exportHtml(); break;
      case 'step-add': stepForm(null); break;
      case 'step-edit': { const s = findStep(); if (s) stepForm(s); break; }
      case 'step-up': moveStep(id, -1); break;
      case 'step-down': moveStep(id, 1); break;
      case 'step-del': {
        const s = findStep(); if (!s) break;
        const nd = (s.docs || []).length;
        if (!confirm('ลบขั้นตอน “' + s.title + '”' + (nd ? ' พร้อมเอกสาร ' + nd + ' รายการ' : '') + ' ?')) break;
        data.steps = data.steps.filter(x => x !== s);
        if (step === s) go(null);
        save('ลบขั้นตอนแล้ว');
        break;
      }
      case 'doc-add': if (step) docAddForm(step); break;
      case 'doc-edit': { const d = findDoc(); if (d) docEditForm(step, d); break; }
      case 'doc-del': {
        const d = findDoc(); if (!d) break;
        if (!confirm('ลบเอกสาร “' + d.name + '” ?')) break;
        step.docs = step.docs.filter(x => x !== d);
        save('ลบเอกสารแล้ว');
        break;
      }
      case 'doc-preview': { const d = findDoc(); if (d) previewDoc(d); break; }
      case 'doc-download': { const d = findDoc(); if (d) downloadDoc(d); break; }
    }
  });
  app.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tl-card[data-action="open"]')) { e.preventDefault(); e.target.click(); }
  });
  window.addEventListener('beforeunload', e => { if (editMode && isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  render();
})();
</script></body></html>
